<style>
/* Layout: one column on a music stand. The rosewood neck is the hero of every practice screen,
   the surrounding UI borrows vintage guitar finish colours, and the tab bar sits under the thumb. */
:root {
  --bg:#E1ECEC; --surface:#F6FAF9; --raised:#D2E1E1; --ink:#12272B; --muted:#47606A; --line:#B5C9CB;
  --accent:#A3440C; --accent-ink:#FFFFFF; --accent-soft:#F3DDCB;
  --good:#17704D; --good-soft:#D2EBDF; --warn:#955305; --bad:#AB3226;
  /* The instrument looks the same in either theme */
  --wood:#3A2118; --wood-grain:#4A2C20; --fretwire:#CFD3CE; --nut:#F0E9D8; --gstring:#DDD8C8; --inlay:#D8CDB4; --wood-text:#E9DFCB;
  --f1:#F0BE45; --f2:#57C4D6; --f3:#F4886F; --f4:#C3A8F2; --f-ink:#14181A;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#0E1C20; --surface:#17292E; --raised:#20363C; --ink:#E8F1F0; --muted:#A0B6B9; --line:#2F474D;
  --accent:#F0A23C; --accent-ink:#1B1206; --accent-soft:#3D2C14;
  --good:#58D19B; --good-soft:#143A2C; --warn:#EDB458; --bad:#F48A76; color-scheme:dark } }
:root[data-theme="dark"] {
  --bg:#0E1C20; --surface:#17292E; --raised:#20363C; --ink:#E8F1F0; --muted:#A0B6B9; --line:#2F474D;
  --accent:#F0A23C; --accent-ink:#1B1206; --accent-soft:#3D2C14;
  --good:#58D19B; --good-soft:#143A2C; --warn:#EDB458; --bad:#F48A76; color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);margin:0}
#wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}
#view{display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.12}
h1{font-size:clamp(1.9rem,6vw,2.6rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
ul,ol{margin:0;padding-left:1.2em;display:grid;gap:6px}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.eyebrow{font:700 .72rem/1.2 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
button,.btn{font:600 .95rem/1.2 var(--body);color:var(--ink);background:var(--raised);border:1px solid transparent;border-radius:10px;padding:11px 14px;min-height:44px;cursor:pointer}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent;border-color:var(--line)}
button.on{background:var(--ink);color:var(--bg)}
button.good{background:var(--good-soft);color:var(--good)}
button.link{background:none;padding:6px 0;min-height:32px;color:var(--accent);border:0;text-align:left}
button.danger{color:var(--bad);background:transparent;border-color:var(--bad)}
button[disabled]{opacity:.5;cursor:default}
input,select,textarea{font:400 16px/1.4 var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:44px}
textarea{font-family:var(--mono);font-size:15px;min-height:190px}
label.field{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.9rem;min-width:0}
input[type=range]{padding:0;background:none;border:0;accent-color:var(--accent)}
.seg{display:inline-flex;background:var(--raised);border-radius:10px;padding:3px}
.seg button{background:none;min-height:38px;padding:7px 12px;font-size:.875rem}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px #0003}
.chip{display:inline-flex;align-items:center;gap:4px;font:700 .82rem/1 var(--mono);padding:6px 8px;border-radius:7px;background:var(--raised);color:var(--ink);border:1px solid transparent}
.chip.need{background:transparent;border:1px dashed var(--muted);color:var(--muted)}
.chip.known{background:var(--good-soft);color:var(--good)}
.head-row{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:space-between;align-items:flex-end}

/* Tab bar */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
#nav .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
#nav button{background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-size:.76rem;color:var(--muted);border:0;min-height:52px}
#nav button svg{width:24px;height:24px}
#nav button.on{color:var(--accent)}

/* Diagrams */
.diagram{width:100%;display:block;touch-action:manipulation}
.diagram text{font-family:var(--mono);font-weight:700}
.neckwrap{border-radius:10px;overflow:hidden;background:var(--wood)}
.hit{fill:transparent;cursor:pointer}
.hit:hover{fill:#ffffff14}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.82rem}
.legend span{display:inline-flex;align-items:center;gap:5px}
.fdot{display:inline-grid;place-items:center;width:22px;height:22px;flex:none;border-radius:50%;color:var(--f-ink);font:700 .75rem/1 var(--mono)}
.f1{background:var(--f1)}.f2{background:var(--f2)}.f3{background:var(--f3)}.f4{background:var(--f4)}
.steps{list-style:none;padding:0;display:grid;gap:6px}
.steps li{display:flex;gap:9px;align-items:center;padding:7px 9px;border-radius:9px;min-width:0}
.steps li.now{background:var(--accent-soft)}
.steps li.later{opacity:.45}
.strs{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.strs button{padding:8px 0;font-family:var(--mono);min-height:46px;min-width:0}
.strs button small{display:block;font-size:.66rem;font-weight:500;color:var(--muted)}
.chordname{font:800 clamp(2.4rem,10vw,3.4rem)/1 var(--display);letter-spacing:-.02em}
.grid-chords{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:9px}
.ctile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 6px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink);min-width:0;position:relative}
.ctile b{font:700 1.05rem/1.2 var(--display)}
.ctile .tick{position:absolute;top:6px;right:7px;color:var(--good);font-weight:700}

/* Learn */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.hero .txt{padding:16px;display:flex;flex-direction:column;gap:10px}
.progress{height:8px;border-radius:9px;background:var(--raised);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:9px}
.path{list-style:none;padding:0;display:grid;gap:0}
.path li{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:10px 4px;border-top:1px solid var(--line);cursor:pointer;width:100%;background:none;color:var(--ink);border-radius:0;text-align:left}
.path li:first-child{border-top:0}
.path .n{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--raised);font:700 .85rem var(--mono)}
.path .done .n,.path li.done .n{background:var(--good-soft);color:var(--good)}
.path li.next .n{background:var(--accent);color:var(--accent-ink)}
.tabs{display:flex;flex-wrap:wrap;gap:6px}

/* Drill and player */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drcard{border:2px solid var(--line);border-radius:12px;padding:6px;text-align:center;font:700 1.25rem var(--display);transition:border-color .1s,background .1s}
.drcard.active{border-color:var(--accent);background:var(--accent-soft)}
.bigtime{font:700 2rem/1 var(--mono);font-variant-numeric:tabular-nums}
.beats{display:flex;gap:7px;justify-content:center;min-height:16px}
.beats i{width:14px;height:14px;border-radius:50%;background:var(--raised)}
.beats i.on{background:var(--accent)}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:12px;align-items:start}
.lyric{min-height:1.5em;font-size:1.02rem;font-weight:500}
.barmap{display:flex;flex-direction:column;gap:10px}
.barline{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:4px}
.bar{font:700 .85rem var(--mono);padding:10px 2px;min-height:42px;background:var(--bg);border:1px solid var(--line);border-radius:7px;min-width:0;overflow-wrap:anywhere}
.bar.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.songcard{display:flex;flex-direction:column;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--ink);text-align:left;width:100%;font-weight:400;min-width:0}
.fieldgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.notice{background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:.92rem}
.err{color:var(--bad);font-weight:600;font-size:.92rem}

/* Tuner */
.gauge-note{font:800 4.2rem/1 var(--display);text-align:center}
.tstate{text-align:center;font-weight:700;min-height:1.5em}
.tstate.ok{color:var(--good)}
#g-needle{transition:transform .12s linear;transform-origin:150px 150px}
.tstr{position:relative}
.tstr.done::after{content:"✓";position:absolute;top:2px;right:6px;color:var(--good);font-size:.8rem}
@media (prefers-reduced-motion: reduce){#g-needle,.drcard{transition:none}}
@media (max-width:600px){
  .stage{grid-template-columns:minmax(0,1fr)}
  .nextbox{flex-direction:row!important;align-items:center;justify-content:center;gap:12px!important}
  .nextbox #st-next{width:92px;flex:none}
}
</style>

  <button data-act="tab" data-tab="songs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>Songs</button>
  <button data-act="tab" data-tab="tune"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3.5 17a9.5 9.5 0 1 1 17 0M12 17l4-7"/><circle cx="12" cy="17" r="1.6" fill="currentColor"/></svg>Tune</button>
</div></nav>

<script>
"use strict";
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cap = n => window.claude && window.claude.use ? window.claude.use(n) : Promise.resolve(null);

/* ───────── Music data ───────── */
const OPEN_MIDI = [40,45,50,55,59,64];
const STRING_NAMES = ["low E","A","D","G","B","high E"];
const STRING_SHORT = ["E","A","D","G","B","e"];
const FINGER_NAMES = {1:"Index",2:"Middle",3:"Ring",4:"Pinky"};
const NOTES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const FLATS = {"Db":"C#","Eb":"D#","Gb":"F#","Ab":"G#","Bb":"A#","Cb":"B","Fb":"E","E#":"F","B#":"C"};
const NICE = {"A#":"Bb","D#":"Eb","G#":"Ab"};
const LIB = {
  C:["x32010","032010"], C7:["x32310","032410"], Cmaj7:["x32000","032000"], Cadd9:["x32030","021030"],
  D:["xx0232","000132"], Dm:["xx0231","000231"], D7:["xx0212","000213"], Dm7:["xx0211","000211"], Dmaj7:["xx0222","000111"], Dsus2:["xx0230","000130"], Dsus4:["xx0233","000134"],
  E:["022100","023100"], Em:["022000","023000"], E7:["020100","020100"], Em7:["022030","012040"], Esus4:["022200","023400"],
  F:["133211","134211"], Fmaj7:["xx3210","003210"],
  G:["320003","210003"], G7:["320001","320001"], Gsus4:["330013","230014"],
  A:["x02220","001230"], Am:["x02210","002310"], A7:["x02020","002030"], Am7:["x02010","002010"], Amaj7:["x02120","002130"], Asus2:["x02200","001200"], Asus4:["x02230","001230"],
  B7:["x21202","021304"], Bm:["x24432","013421"]
};
const SHAPES = {
  "":     {E:["022100","134211"], A:["x02220","x13331"]},
  m:      {E:["022000","134111"], A:["x02210","x13421"]},
  "7":    {E:["020100","131211"], A:["x02020","x13141"]},
  m7:     {E:["020000","131111"], A:["x02010","x13121"]},
  maj7:   {E:["0x110x","1x342x"], A:["x02120","x13241"]},
  sus4:   {E:["022200","123411"], A:["x02230","x12341"]},
  sus2:   {A:["x02200","x13411"]},
  "5":    {E:["022xxx","134xxx"], A:["x022xx","x134xx"]},
  dim:    {A:["x0121x","x1243x"]}
};
const QUALITY = {
  "":["",0], maj:["",0], M:["",0], m:["m",0], min:["m",0], "-":["m",0],
  "7":["7",0], dom7:["7",0], m7:["m7",0], min7:["m7",0], "-7":["m7",0], maj7:["maj7",0], M7:["maj7",0],
  sus:["sus4",0], sus4:["sus4",0], sus2:["sus2",0], "5":["5",0], dim:["dim",0], dim7:["dim",1], "°":["dim",0],
  "9":["7",1], "11":["7",1], "13":["7",1], "7sus4":["sus4",1], m9:["m7",1], m11:["m7",1], maj9:["maj7",1],
  add9:["",1], add2:["",1], "6":["",1], m6:["m",1], aug:["",1], "+":["",1], m7b5:["dim",1]
};
const parseRoot = n => { const m = /^([A-G])([#b]?)(.*)$/.exec(n); if (!m) return null; let r = m[1]+m[2]; r = FLATS[r] || r; return {root:r, rest:m[3], raw:m[1]+m[2]}; };
const cache = {};
function getChord(input) {
  const name = String(input).trim();
  if (cache[name] !== undefined) return cache[name];
  const base = name.split("/")[0];
  const p = parseRoot(base);
  if (!p) return cache[name] = null;
  const direct = LIB[p.raw+p.rest] || LIB[(NICE[p.root]||p.root)+p.rest] || LIB[p.root+p.rest];
  let out;
  if (direct) out = build(name, base, direct[0], direct[1], 0);
  else {
    let q = QUALITY[p.rest];
    if (!q) { if (/^(m|min|-)(?!aj)/.test(p.rest)) q = ["m",1]; else if (/^[A-Za-z0-9#b+()°-]*$/.test(p.rest)) q = ["",1]; else return cache[name] = null; }
    const simple = (NICE[p.root]||p.root)+q[0];
    if (LIB[p.root+q[0]] || LIB[simple]) { const d = LIB[p.root+q[0]] || LIB[simple]; out = build(name, simple, d[0], d[1], q[1]); }
    else out = fromShape(name, p.root, q[0], q[1]);
  }
  return cache[name] = out;
}
function digits(s){ return [...s].map(c => c === "x" ? -1 : +c); }
function build(name, shown, frets, fingers, simplified) {
  return {name, shown, frets:digits(frets), fingers:digits(fingers).map(v => Math.max(0,v)), simplified:!!simplified};
}
function fromShape(name, root, q, simplified) {
  const semi = NOTES.indexOf(root), s = SHAPES[q] || SHAPES[""];
  const opts = [];
  const openOk = q === "dim" || q === "5"; /* these shapes have no barre, so they can use open strings */
  if (s.E) opts.push([((semi-4+12)%12)||(openOk?0:12), s.E]);
  if (s.A) opts.push([((semi-9+12)%12)||(openOk?0:12), s.A]);
  opts.sort((a,b) => a[0]-b[0]);
  const [fret, shape] = opts[0];
  const off = digits(shape[0]), fing = digits(shape[1]).map(v => Math.max(0,v));
  return {name, shown:(NICE[root]||root)+q, frets:off.map(o => o < 0 ? -1 : o+fret), fingers:fing, simplified:!!simplified, barred:true};
}
function layout(c) {
  const fretted = c.frets.filter(f => f > 0);
  const max = Math.max(...fretted, 1), min = Math.min(...fretted, 1);
  const base = max <= 4 ? 1 : min;
  return {base, n:Math.max(4, max-base+1)};
}
function fingerSteps(c) {
  const groups = {};
  c.frets.forEach((fr,i) => { if (fr > 0) { const k = c.fingers[i]+":"+fr; (groups[k] = groups[k] || {finger:c.fingers[i], fret:fr, strings:[]}).strings.push(i); } });
  return Object.values(groups).sort((a,b) => a.strings[0]-b.strings[0]);
}
const ordinal = n => n + (["th","st","nd","rd"][(n%100>10&&n%100<14)?0:(n%10)] || "th");
function stepText(st) {
  const name = FINGER_NAMES[st.finger] || "Finger";
  if (st.strings.length > 1) return `${name} finger lies flat across ${STRING_NAMES[st.strings[0]]} to ${STRING_NAMES[st.strings[st.strings.length-1]]}, ${ordinal(st.fret)} fret`;
  return `${name} finger on the ${STRING_NAMES[st.strings[0]]} string, ${ordinal(st.fret)} fret`;
}
function strumNote(c) {
  const skip = c.frets.map((f,i) => f < 0 ? STRING_NAMES[i] : null).filter(Boolean);
  const open = c.frets.map((f,i) => f === 0 ? STRING_NAMES[i] : null).filter(Boolean);
  const a = [];
  if (skip.length) a.push(`Don't play ${skip.join(" or ")}.`);
  if (open.length) a.push(`Let ${open.join(", ")} ring open.`);
  return a.join(" ") || "Every string rings.";
}
function transposeName(name, by) {
  if (!by) return name;
  return name.split("/").map(part => {
    const p = parseRoot(part); if (!p) return part;
    const r = NOTES[(NOTES.indexOf(p.root)+by+120)%12];
    return (NICE[r]||r)+p.rest;
  }).join("/");
}

/* ───────── Lessons and songs ───────── */
const LESSONS = [
 {id:"start", title:"Get set up", goal:"Tune up and learn how fingers are numbered", chords:[], pairs:[], songs:[], target:0, tips:[
   "Tune first, every time. An out-of-tune guitar makes correct fingering sound wrong.",
   "Fingers are numbered 1 index, 2 middle, 3 ring, 4 pinky. Every diagram here uses those colours.",
   "Sit up, keep the guitar body against you, and let your fretting thumb rest behind the neck without squeezing.",
   "Press just behind the fret wire with your fingertip, not the pad. Less pressure is needed than you'd think."], cta:"tune"},

function parseChart(text) {
  const sections = []; let sec = null, line = null;
  const lines = String(text).split(/\r?\n/);
  const need = () => { if (!sec) { sec = {name:"Song", lines:[]}; sections.push(sec); } };
  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i].trim();
    if (!raw) continue;
    const h = /^\[(.+)\]$/.exec(raw);
    if (h) { sec = {name:h[1], lines:[]}; sections.push(sec); line = null; continue; }
    if (raw[0] === ">") { if (line) line.lyric = raw.slice(1).trim(); continue; }
    need();
    const hasBars = raw.includes("|");
    const barTexts = hasBars ? raw.split("|").map(s => s.trim()).filter(Boolean) : raw.split(/\s+/);
    const bars = [];
    for (const bt of barTexts) {
      const toks = bt.split(/\s+/).filter(Boolean), chords = [];
      for (const t of toks) {
        if (t === "%" || t === "/") { const prev = bars.length ? bars[bars.length-1] : null; if (chords.length) chords.push(chords[chords.length-1]); else if (prev) chords.push(prev[prev.length-1]); continue; }
        if (!getChord(t)) throw new Error(`Line ${i+1}: "${t}" doesn't look like a chord. Start lyric lines with > and section names with [ ].`);
        chords.push(t);
      }
      if (chords.length) bars.push(chords);
    }
    if (bars.length) { line = {bars, lyric:""}; sec.lines.push(line); }
  }
  const real = sections.filter(s => s.lines.length);
  if (!real.length) throw new Error("Add at least one line of chords, for example: | G | C | D | G |");
  return real;
}
function songChords(song, by=0) {
  const set = [];
  for (const s of parseChart(song.chart)) for (const l of s.lines) for (const b of l.bars) for (const c of b) { const n = transposeName(c, by); if (!set.includes(n)) set.push(n); }
  return set;
}

let soundCapo = 0; /* semitones added on a song page that uses a capo, so the sound matches the recording */
const Audio_ = {
  ctx:null, bufs:{},
  get() {
    if (!this.ctx) { const C = window.AudioContext || window.webkitAudioContext; this.ctx = new C(); }
    if (this.ctx.state === "suspended") this.ctx.resume();
    /* "playback" keeps sound on in Silent Mode, but must never be set while the mic is starting or running */
    try { if (navigator.audioSession && !Tuner.on && !Tuner.starting) navigator.audioSession.type = "playback"; } catch (e) {}
    return this.ctx;
  },
  buffer(N, sr) {
    if (this.bufs[N]) return this.bufs[N];
    const len = Math.floor(sr*2.2), b = this.ctx.createBuffer(1, len, sr), d = b.getChannelData(0);
    let prev = 0;
    for (let i = 0; i < N; i++) { const w = Math.random()*2-1; prev = prev*.55 + w*.45; d[i] = prev; }
    const decay = .9965 + Math.min(.003, N/200000);
    for (let i = N; i < len; i++) d[i] = decay*.5*(d[i-N] + (d[i-N-1]||0));
    for (let i = 0; i < 2000; i++) d[len-1-i] *= i/2000;
    return this.bufs[N] = b;
  },
  pluck(freq, when, gain=.5) {
    const ctx = this.get(), sr = ctx.sampleRate, N = Math.max(8, Math.floor(sr/freq - .5));
    const src = ctx.createBufferSource(); src.buffer = this.buffer(N, sr);
    src.playbackRate.value = freq*(N+.5)/sr;
    const g = ctx.createGain(); g.gain.value = gain;
    src.connect(g).connect(ctx.destination);
    src.start(when || ctx.currentTime);
  },
  strum(c, when, dir="D", gain=.34) {
    const ctx = this.get(), t = when || ctx.currentTime;
    const idx = [0,1,2,3,4,5].filter(i => c.frets[i] >= 0);
    if (dir === "U") idx.reverse();
    idx.forEach((s,k) => this.pluck(midiFreq(OPEN_MIDI[s]+c.frets[s]+soundCapo), t+k*.016, gain*(dir==="U"?.75:1)));
  },
  click(when, accent) {
    const ctx = this.get(), o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = accent ? 1760 : 1100; o.type = "square";
    g.gain.setValueAtTime(accent ? .22 : .13, when);
    g.gain.exponentialRampToValueAtTime(.001, when+.04);
    o.connect(g).connect(ctx.destination); o.start(when); o.stop(when+.05);
  }
};

async function keepAwake(on) {

function startClock(bpm, cb) {
  const ctx = Audio_.get();
  let next = ctx.currentTime + .15, tick = 0;
  const c = {bpm, stopped:false, stop() { this.stopped = true; clearInterval(id); if (clock === this) clock = null; keepAwake(false); }};
  const id = setInterval(() => {

function neckSVG(c, reveal=99) {

  for (let r = 0; r < n; r++) {
    const f = base+r, cx = mx(fx(r+.5));
    if ([3,5,7,9,15,17,19,21].includes(f)) g += `<circle cx="${cx}" cy="104.5" r="8" fill="var(--inlay)"/>`;
    if (f === 12) g += `<circle cx="${cx}" cy="75" r="7" fill="var(--inlay)"/><circle cx="${cx}" cy="134" r="7" fill="var(--inlay)"/>`;
    g += `<text x="${cx}" y="215" text-anchor="middle" font-size="14" fill="var(--wood-text)">${f}</text>`;
  }
  for (let r = 0; r <= n; r++) g += `<line x1="${mx(fx(r))}" x2="${mx(fx(r))}" y1="14" y2="195" stroke="var(--fretwire)" stroke-width="${r===0 && base===1 ? 0 : 3}"/>`;
  if (base === 1) g += `<rect x="${L ? mx(x0) : x0-8}" y="12" width="8" height="185" fill="var(--nut)"/>`;
  for (let i = 0; i < 6; i++) {
    g += `<line x1="${mx(x0-6)}" x2="${mx(x1)}" y1="${y(i)}" y2="${y(i)}" stroke="var(--gstring)" stroke-width="${(1+(5-i)*.42).toFixed(2)}"/>`;
    g += `<text x="${mx(12)}" y="${y(i)+6}" text-anchor="middle" font-size="17" fill="var(--wood-text)">${STRING_SHORT[i]}</text>`;

    if (fr < 0) g += `<path d="M${mx(36)-8} ${y(i)-8}l16 16M${mx(36)+8} ${y(i)-8}l-16 16" stroke="var(--f3)" stroke-width="3" stroke-linecap="round"/>`;

function chartSVG(c, reveal=99) {

  for (let i = 0; i < 6; i++) {

  });
  return `<svg class="diagram" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.shown)} chord chart. ${esc(fingerSteps(c).map(stepText).join(". "))}">${g}</svg>`;

function startDrill() {

      if (!UI.drill || !UI.drill.running) return;
      document.querySelectorAll("#dr-beats i").forEach((n,i) => n.classList.toggle("on", i===beat));

}

/* YIN pitch detection. Pure, so it can be tested with synthetic signals. */

  const el = ev.target.closest("[data-act]"); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (fn) { ev.stopPropagation(); fn(el.dataset, el); }
});
document.addEventListener("keydown", ev => {
  if ((ev.key==="Enter"||ev.key===" ") && ev.target.matches && ev.target.matches("li[data-act]")) { ev.preventDefault(); ev.target.click(); }
});
document.addEventListener("input", ev => {
  const el = ev.target, k = el.dataset && el.dataset.input; if (!k) return;
  if (k==="search") { UI.search = el.value; $("#search-out").innerHTML = searchResults(); }
  if (k==="ed") { UI.editing[el.dataset.f] = el.value; }
  if (k==="ask") { UI.editing.ask = el.value; }
  if (k==="drill-bpm") { UI.drill.bpm = +el.value; if (clock) clock.bpm = +el.value; $("#dr-cpm").textContent = `${el.value/4} changes a minute`; }
  if (k==="song-tempo") { const s = curSong(); setPref(s, "tempo", +el.value); $("#tempo-v").textContent = el.value+" bpm"; if (clock) clock.bpm = +el.value; }
  if (k==="song-pattern") { const s = curSong(); stopSong(); setPref(s, "pattern", el.value); }
  if (k==="tuning") { S.tuning = el.value; Tuner.done = {}; Tuner.locked = null; save(); render(); }
});
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (["learn","chords","songs","tune"].includes(h) && h!==UI.tab) go(h); });

const h0 = (location.hash||"").slice(1);
if (["learn","chords","songs","tune"].includes(h0)) UI.tab = h0;
render();
initSync();
cap("sample").then(fn => { if (fn) { sampleFn = fn; samplePresent = true; if (UI.editing) render(); } });
if ("serviceWorker" in navigator && window.self === window.top && document.querySelector('link[rel="manifest"]')) { navigator.serviceWorker.register("sw.js").catch(() => {}); }
window.Fretline = {yin, getChord, parseChart, fingerSteps, transposeName, songChords, SONGS, LESSONS, CHORD_GROUPS, midiFreq, Audio:Audio_};
})();
